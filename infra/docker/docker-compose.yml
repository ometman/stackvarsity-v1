services:
  postgres:
    image: postgres:18-alpine
    container_name: stackvarsity-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stackvarsity_dev}
    volumes:
      - stackvarsity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stackvarsity_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stackvarsity_pgdata:
